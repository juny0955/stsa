spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: collector
  datasource:
    url: jdbc:postgresql://localhost:5432/stsa?socketTimeout=30
    username: postgres
    password: postgres

  jooq:
    sql-dialect: postgres

  flyway:
    enabled: false

finnhub:
  api-key: ${FINNHUB_API_KEY:}
  base-url: https://finnhub.io/api/v1
  request-timeout: 10s
  news:
    execution-timeout-ms: 300000
